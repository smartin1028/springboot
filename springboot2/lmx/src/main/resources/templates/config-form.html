<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>서버 설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>서버 설정 정보 입력</h2>
        <form th:action="@{/config}" th:object="${serverConfig}" method="post">
            <div class="mb-3">
                <label for="serverIp" class="form-label">서버 IP</label>
                <input type="text" class="form-control" id="serverIp" th:field="*{serverIp}" required>
            </div>
            <div class="mb-3">
                <label for="serverPort" class="form-label">서버 포트</label>
                <input type="text" class="form-control" id="serverPort" th:field="*{serverPort}" required>
            </div>
            <div class="mb-3">
                <label for="xmlContent" class="form-label">XML 내용</label>
                <textarea class="form-control" id="xmlContent" th:field="*{xmlContent}" rows="5" required></textarea>
            </div>
            <div class="mb-3">
                <label for="target" class="form-label">타겟</label>
                <input type="text" class="form-control" id="target" th:field="*{target}">
            </div>
            <div class="mb-3">
                <label for="daemonInfo" class="form-label">데몬 정보</label>
                <input type="text" class="form-control" id="daemonInfo" th:field="*{daemonInfo}">
            </div>
            <div class="mb-3">
                <label for="etcInfo1" class="form-label">기타 정보 1</label>
                <input type="text" class="form-control" id="etcInfo1" th:field="*{etcInfo1}">
            </div>
            <div class="mb-3">
                <label for="etcInfo2" class="form-label">기타 정보 2</label>
                <input type="text" class="form-control" id="etcInfo2" th:field="*{etcInfo2}">
            </div>
            <div class="mb-3">
                <label for="etcInfo3" class="form-label">기타 정보 3</label>
                <input type="text" class="form-control" id="etcInfo3" th:field="*{etcInfo3}">
            </div>
            <button type="submit" class="btn btn-primary">제출</button>
        </form>
    </div>
</body>
</html>
