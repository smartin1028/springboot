<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>설정 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-success" th:text="${message}"></div>
        <h3>제출된 설정 정보</h3>
        <div class="card">
            <div class="card-body">
                <p><strong>서버 IP:</strong> <span th:text="${serverConfig.serverIp}"></span></p>
                <p><strong>서버 포트:</strong> <span th:text="${serverConfig.serverPort}"></span></p>
                <p><strong>XML 내용:</strong></p>
                <pre class="bg-light p-3" th:text="${serverConfig.xmlContent}"></pre>
                <p><strong>타겟:</strong> <span th:text="${serverConfig.target}"></span></p>
                <p><strong>데몬 정보:</strong> <span th:text="${serverConfig.daemonInfo}"></span></p>
                <p><strong>기타 정보 1:</strong> <span th:text="${serverConfig.etcInfo1}"></span></p>
                <p><strong>기타 정보 2:</strong> <span th:text="${serverConfig.etcInfo2}"></span></p>
                <p><strong>기타 정보 3:</strong> <span th:text="${serverConfig.etcInfo3}"></span></p>
            </div>
        </div>
        <a href="/config" class="btn btn-primary mt-3">다시 입력하기</a>
    </div>
</body>
</html>
